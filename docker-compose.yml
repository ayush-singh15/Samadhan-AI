version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trisetu-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: trisetu_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: trisetu-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: trisetu-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/trisetu_db?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: "http://ai-service:8000"
    depends_on:
      - postgres
      - redis

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: trisetu-ai-service
    restart: always
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: trisetu-web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
